<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>SC Grabber</title>
    <link rel="stylesheet" href="ui.css" />
    <style>
      body { padding: 12px; }
      header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
      header .grow { flex: 1; }
      #summary { margin: 0 0 10px; }
      #empty { padding: 28px 8px; text-align: center; }
      #list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
      .item { border: 1px solid var(--border); border-radius: 8px; padding: 8px; background: var(--surface); }
      .item .top { display: flex; gap: 8px; align-items: center; }
      .item img { width: 36px; height: 36px; border-radius: 4px; object-fit: cover; background: var(--border); flex: 0 0 auto; }
      .item .info { flex: 1 1 auto; min-width: 0; }
      .item .title { font-weight: 600; }
      .item .actions { display: flex; gap: 4px; flex: 0 0 auto; }
      .item .line { display: flex; justify-content: space-between; gap: 8px; margin-top: 6px; font-size: 12px; }
      .item progress { width: 100%; height: 6px; margin-top: 4px; accent-color: var(--accent); }
      .item .note { font-size: 12px; margin-top: 4px; overflow-wrap: anywhere; }
    </style>
  </head>
  <body>
    <header>
      <h1 class="grow" data-i18n="panelTitle"></h1>
      <button id="cancelAll" class="small" data-i18n="panelCancelAll"></button>
      <button id="clear" class="small" data-i18n="panelClear"></button>
    </header>
    <p id="summary" class="muted" role="status"></p>
    <p id="empty" class="muted" data-i18n="panelEmpty"></p>
    <ul id="list"></ul>
    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
